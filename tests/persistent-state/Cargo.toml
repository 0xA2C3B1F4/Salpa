[package]
name = "salpa-persistent-state-tests"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.88"

[dependencies]
cbor-smol = "0.5.1"
cosey = "0.4"
ctap-types = { version = "0.6.0-rc.5", features = ["platform-serde", "get-info-full", "large-blobs", "third-party-payment"] }
heapless = "0.9"
hmac = "0.12.1"
subtle = { version = "2.6.1", default-features = false }
trussed-hkdf = "0.4"
ctaphid-dispatch = "0.4.0"
fido-authenticator = { path = "../../third_party/fido-authenticator", features = [
    "credential-id-format-v2",
    "dispatch",
] }
heapless-bytes = "0.5.0"
hex-literal = "0.4.1"
littlefs2-core = "0.1.3"
sha2 = "0.10.9"
tempfile = "3.23.0"
trussed = { git = "https://github.com/solokeys/trussed", rev = "2ea719b28245f0e68960e99aab16131f7f14d8ff", features = [
    "virt",
] }
trussed-core = { path = "../../third_party/trussed-core", features = [
    "filesystem-client",
] }
trussed-staging = { version = "0.5.0", features = ["fs-info", "hkdf", "virt"] }
zeroize = { version = "1.9.0", default-features = false }

[patch.crates-io]
ctap-types = { git = "https://github.com/solokeys/ctap-types", rev = "3a5bcecb5286630f38dcc3c65a8f500f7abf2d42" }
interchange = { path = "../../third_party/interchange" }
ref-swap = { path = "../../third_party/ref-swap" }
trussed = { git = "https://github.com/solokeys/trussed", rev = "2ea719b28245f0e68960e99aab16131f7f14d8ff" }
trussed-core = { path = "../../third_party/trussed-core" }

[workspace]
